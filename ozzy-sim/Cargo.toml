[package]
autotests = false
name = "ozzy-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic workloads and fault simulation for Ozzy components."
readme = "README.md"
publish = false

[features]
broker = ["dep:bytes", "dep:clap", "dep:futures", "dep:ozzy-broker", "dep:ozzy-config", "dep:ozzy-io", "dep:ozzy-proto", "dep:ozzy-replication", "dep:ozzy-runtime", "dep:serde", "dep:serde_json", "dep:tokio", "dep:uuid"]

[dependencies]
bytes = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
ozzy-broker = { workspace = true, features = ["simulation"], optional = true }
ozzy-config = { workspace = true, optional = true }
ozzy-io = { workspace = true, features = ["simulation"], optional = true }
ozzy-proto = { workspace = true, optional = true }
ozzy-replication = { workspace = true, optional = true }
ozzy-runtime = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
uuid = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ozzy-core.workspace = true
ozzy-journal.workspace = true
thiserror.workspace = true

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
omq-tokio.workspace = true
ozzy-journal-segment = { workspace = true, features = ["lz4", "simulation"] }
ozzy-proto.workspace = true
ozzy-replication.workspace = true
ozzy-runtime = { workspace = true, features = ["simulation"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "test-util"] }

[lints]
workspace = true

[[bin]]
name = "ozzy_sim"
path = "src/bin/ozzy_sim.rs"
required-features = ["broker"]

[[test]]
name = "ozzy_broker_simulation"
path = "tests/broker/mod.rs"
required-features = ["broker"]

[[test]]
name = "ozzy_canonical_state"
path = "tests/canonical_state.rs"

[[test]]
name = "ozzy_driver_liveness"
path = "tests/driver_liveness.rs"

[[test]]
name = "ozzy_lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "ozzy_replication"
path = "tests/replication.rs"

[[test]]
name = "ozzy_segment_replay"
path = "tests/segment_replay.rs"

[[test]]
name = "ozzy_view_change_storage"
path = "tests/view_change_storage.rs"

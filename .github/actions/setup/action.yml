name: Set up Ozzy workspace
description: Install Rust, test tools, and the Cargo cache.
inputs:
  toolchain:
    description: Rust toolchain to install
    required: false
    default: stable
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo mkdir -p /mnt/ssd/tmp
        sudo chown "$(id -u):$(id -g)" /mnt/ssd/tmp
        printf '%s\n' 'TMPDIR=/mnt/ssd/tmp' >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: clippy,rustfmt
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ozzy
        cache-targets: false
        cache-directories: /mnt/ssd/tmp/ozzy-ci-target

name: Release-plz

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TARGET_DIR: /mnt/ssd/tmp/ozzy-release-target
  TMPDIR: /mnt/ssd/tmp
  RUSTFLAGS: -C target-cpu=x86-64

jobs:
  release-plz:
    if: >-
      github.repository == 'paddor/ozzy' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare build directories
        run: |
          sudo mkdir -p /mnt/ssd/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/ssd/tmp
      - name: Check tested revision
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tested="$TESTED_SHA"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if test "$(git rev-parse HEAD)" = "$tested" && test "$tested" = "$latest"; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tested&event=push&status=success" \
              --jq 'if (.workflow_runs | length) > 0 then "tested=true" else "tested=false" end' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish merged release
        if: steps.revision.outputs.tested == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release PR
        if: steps.revision.outputs.tested == 'true'
        id: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/ozzy/target
  RUSTFLAGS: -C target-cpu=x86-64

defaults:
  run:
    working-directory: ozzy

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/test-all.sh lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/ozzy_cargo build --workspace --locked
      - run: ./scripts/test-all.sh tests
        env:
          NEXTEST_PROFILE: ci
          NEXTEST_FINAL_STATUS_LEVEL: pass

  msrv:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
        with:
          toolchain: '1.93'
      - run: ./scripts/ozzy_cargo check --workspace --all-targets --locked

  publish-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/ozzy_cargo publish --workspace --exclude ozzy-bench --exclude ozzy-sim --dry-run --locked
        env:
          # Cargo caches staged registry dependencies as immutable at each version.
          CARGO_TARGET_DIR: ${{ runner.temp }}/ozzy-publish-${{ github.run_id }}-${{ github.run_attempt }}

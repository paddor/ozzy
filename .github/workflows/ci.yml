name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /mnt/ssd/tmp/ozzy-ci-target
  RUSTFLAGS: -C target-cpu=x86-64

defaults:
  run:
    working-directory: ozzy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/ozzy_cargo build --workspace --locked
      - run: ./scripts/test-all.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
        with:
          toolchain: '1.93'
      - run: ./scripts/ozzy_cargo check --workspace --all-targets --locked

  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/ozzy_cargo publish --workspace --exclude ozzy-bench --exclude ozzy-sim --dry-run --locked

name: Extended

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: extended
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/ozzy/target
  RUSTFLAGS: -C target-cpu=x86-64

defaults:
  run:
    working-directory: ozzy

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/test-all.sh lint

  stress:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/ozzy_cargo build --workspace --locked
      - run: >-
          ./scripts/ozzy_cargo nextest run --workspace --profile extended
          --test-threads 8 --status-level fail --final-status-level fail

  loom:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: ozzy
      - uses: ./ozzy/.github/actions/setup
      - run: ./scripts/test.sh loom

[package]
autotests = false
name = "ozzy-journal-segment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Segmented append-only journal implementation for Ozzy."
readme = "README.md"
publish = ["crates-io"]
keywords = ["journal", "append-only", "storage", "persistence", "ozzy"]
categories = ["database-implementations", "filesystem"]
include.workspace = true

[features]
simulation = ["ozzy-io/simulation"]
lz4 = []

[dependencies]
ahash.workspace = true
bytes.workspace = true
lz4rip.workspace = true
smallvec.workspace = true
ozzy-journal.workspace = true
ozzy-proto.workspace = true
ozzy-core.workspace = true
ozzy-io.workspace = true
ozzy-telemetry.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ozzy-io-aio.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
ozzy-io = { workspace = true, features = ["simulation"] }
ozzy-io-pool.workspace = true
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "ozzy_checkpoint"
path = "tests/checkpoint.rs"

[[test]]
name = "ozzy_codec"
path = "tests/codec.rs"

[[test]]
name = "ozzy_index"
path = "tests/index.rs"

[[test]]
name = "ozzy_index_file"
path = "tests/index_file.rs"

[[test]]
name = "ozzy_metadata"
path = "tests/metadata.rs"

[package]
autotests = false
name = "ozzy-io-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Explicit bounded file workers for Ozzy"

[dependencies]
fanring.workspace = true
futures.workspace = true
ozzy-io.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
libc = "0.2"

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
ozzy-io = { workspace = true, features = ["simulation"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Keep this test-only back edge out of the registry dependency graph.
ozzy-io-aio = { path = "../ozzy-io-aio" }

[lints]
workspace = true

[[test]]
name = "ozzy_io_conformance"
path = "tests/conformance.rs"

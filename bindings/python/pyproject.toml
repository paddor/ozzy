[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "ozzy"
dynamic = ["version"]
description = "Python producers and consumers for Ozzy, powered by its Rust SDK"
requires-python = ">=3.12"
license = "ISC"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3 :: Only", "Typing :: Typed"]

[project.urls]
Repository = "https://github.com/paddor/ozzy"

[tool.maturin]
module-name = "ozzy._native"
python-source = "python"
features = ["extension-module"]
strip = true

[dependency-groups]
dev = ["maturin>=1.14,<2", "mypy>=1.15", "ruff>=0.11"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["python/ozzy"]

[package]
name = "ozzy-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["crates-io"]
keywords = ["async", "file-io", "storage", "backpressure", "ozzy"]
categories = ["asynchronous", "filesystem"]
include.workspace = true
description = "Owned asynchronous file operations and resource contracts for Ozzy"
readme = "README.md"

[features]
simulation = ["dep:serde"]

[dependencies]
bytes.workspace = true
fanring.workspace = true
futures.workspace = true
pin-project-lite.workspace = true
serde = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
loom = "0.7"

[lints]
workspace = true

[[test]]
name = "ozzy_io_loom"
path = "tests/loom.rs"

[[test]]
name = "ozzy_raw_notify_ban"
path = "tests/raw_notify_ban.rs"

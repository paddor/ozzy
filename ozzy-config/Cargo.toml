[package]
name = "ozzy-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Validated deployment configuration and persistent identity for Ozzy."
readme = "README.md"
publish = ["crates-io"]
keywords = ["configuration", "deployment", "validation", "toml", "ozzy"]
categories = ["config"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/examples/*.toml"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["serde"] }
xxhash-rust.workspace = true

[lints]
workspace = true

[[test]]
name = "ozzy_config"
path = "tests/config.rs"
